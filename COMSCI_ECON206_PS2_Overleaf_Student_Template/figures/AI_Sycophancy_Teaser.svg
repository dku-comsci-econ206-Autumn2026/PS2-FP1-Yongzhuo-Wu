<svg xmlns="http://www.w3.org/2000/svg" width="1890" height="460" viewBox="0 0 1890 460" role="img" aria-labelledby="title desc"><title id="title">Correction-service model and observed author reflection</title><desc id="desc">Baseline SS, strong zero-cost HH, strong cost-one every pure and mixed equilibrium. One author chose correction A with stated willingness to pay 3 versus 0. The future discriminating design has not been conducted.</desc><rect width="1890" height="460" fill="#FFFFFF"/>
<text x="315.0" y="41.870" text-anchor="middle" font-family="Georgia" font-size="44" font-weight="700" fill="#212A33">Economics</text>
<text x="315.0" y="94.816" text-anchor="middle" font-family="Arial" font-size="36" font-weight="400" fill="#212A33">Q1: When is honesty profitable?</text>
<rect x="37" y="122" width="556" height="150" fill="#FFFFFF" stroke="#003399" stroke-width="2"/>
<text x="315.0" y="163.116" text-anchor="middle" font-family="Arial" font-size="36" font-weight="400" fill="#212A33">Baseline/weak: SS</text>
<text x="315.0" y="206.316" text-anchor="middle" font-family="Arial" font-size="36" font-weight="400" fill="#212A33">Strong c=0: HH</text>
<text x="315.0" y="249.516" text-anchor="middle" font-family="Arial" font-size="36" font-weight="400" fill="#212A33">Strong c=1: all equilibria</text>
<text x="945.0" y="41.870" text-anchor="middle" font-family="Georgia" font-size="44" font-weight="700" fill="#212A33">Computer science</text>
<text x="945.0" y="94.816" text-anchor="middle" font-family="Arial" font-size="36" font-weight="400" fill="#212A33">Q2: How do payments affect supply?</text>
<rect x="667" y="122" width="556" height="150" fill="#FFFFFF" stroke="#003399" stroke-width="2"/>
<text x="945.0" y="163.116" text-anchor="middle" font-family="Arial" font-size="36" font-weight="400" fill="#212A33">Fixed k; top k bids win</text>
<text x="945.0" y="206.316" text-anchor="middle" font-family="Arial" font-size="36" font-weight="400" fill="#212A33">Price: highest losing bid</text>
<text x="945.0" y="249.516" text-anchor="middle" font-family="Arial" font-size="36" font-weight="400" fill="#212A33">Correction surplus W; access k/3</text>
<text x="1575.0" y="41.870" text-anchor="middle" font-family="Georgia" font-size="44" font-weight="700" fill="#212A33">Behavioral science</text>
<text x="1575.0" y="94.816" text-anchor="middle" font-family="Arial" font-size="36" font-weight="400" fill="#212A33">Q3: Will users pay for correction?</text>
<rect x="1297" y="122" width="556" height="150" fill="#FFFFFF" stroke="#006633" stroke-width="2"/>
<text x="1575.0" y="163.116" text-anchor="middle" font-family="Arial" font-size="36" font-weight="400" fill="#212A33">Observed: one author record</text>
<text x="1575.0" y="206.316" text-anchor="middle" font-family="Arial" font-size="36" font-weight="400" fill="#212A33">Correction A preferred</text>
<text x="1575.0" y="249.516" text-anchor="middle" font-family="Arial" font-size="36" font-weight="400" fill="#212A33">Stated WTP: A=3, B=0</text>
<rect x="60" y="290" width="1770" height="44" fill="#F4F6F7" stroke="none" stroke-width="2"/>
<text x="945.0" y="321.316" text-anchor="middle" font-family="Arial" font-size="36" font-weight="700" fill="#212A33">Can net correction revenue change supply without sacrificing access?</text>
<text x="945.0" y="365.816" text-anchor="middle" font-family="Arial" font-size="36" font-weight="400" fill="#212A33">H = verifiable correction. S = sycophancy. Demand values are hypothetical.</text>
<text x="945.0" y="407.816" text-anchor="middle" font-family="Arial" font-size="36" font-weight="400" fill="#212A33">Solid boxes: computed model and author reflection. Dashed outline: proposed test.</text>
<rect x="60" y="423" width="1770" height="36" fill="#FFFFFF" stroke="#56616B" stroke-width="2" stroke-dasharray="8 6"/>
<text x="945.0" y="450.316" text-anchor="middle" font-family="Arial" font-size="36" font-weight="400" fill="#212A33">Future design: matched tone/order, delayed accuracy, incentivized purchase.</text>
</svg>
